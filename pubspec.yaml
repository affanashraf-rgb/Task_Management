name: management_app
description: "A task management application using Flutter and SQLite."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.18.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_timezone: ^2.0.0
  path_provider: ^2.1.1
  csv: ^5.1.1
  pdf: ^3.10.4
  printing: ^5.11.0
  share_plus: ^7.1.0
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
